plugins {
    id 'com.android.application'
}

def gitOutput = { String... arguments ->
    providers.exec {
        workingDir rootDir
        commandLine(['git'] + arguments.toList())
    }.standardOutput.asText.get().trim()
}

if (gitOutput('rev-parse', '--is-shallow-repository') != 'false') {
    throw new GradleException('APK versioning requires full Git history. Run git fetch --unshallow.')
}
def revision = gitOutput('rev-list', '--first-parent', '--count', 'HEAD').toInteger()
def appVersionName = String.format(Locale.ROOT, '1.0.%02d', revision)

android {
    namespace 'com.skystream.ssyoutube'
    compileSdk 34

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId "com.skystream.ssyoutube"
        minSdk 21
        targetSdk 34
        versionCode revision + 1
        versionName appVersionName
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    packaging {
        resources {
            merges += ['META-INF/LICENSE', 'META-INF/LICENSE.txt', 'META-INF/NOTICE',
                       'META-INF/NOTICE.txt']
        }
    }
}

tasks.register('printVersionName') {
    doLast { println appVersionName }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.media3:media3-ui:1.4.1'
    implementation 'io.github.abdallahmehiz:mpv-android-lib:0.1.12'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
    implementation 'com.github.teamnewpipe:NewPipeExtractor:v0.26.5'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs_nio:2.1.5'
    testImplementation 'junit:junit:4.13.2'
}
